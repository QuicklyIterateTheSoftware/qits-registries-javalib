# Defaults this library jar ships (ordinal 100 — a jar's application.properties is ignored). The
# consuming service or its environment overrides any of them.
#
# NO DATASOURCE, NO PERSISTENCE UNIT AND NO FLYWAY KEYS. The module this came from shipped all
# three, which forced every consumer onto one named datasource and one migration lineage. A lib owns
# neither: the service that owns the tables names its datasource, assigns
# eu.wohlben.qits.artifacts.entity to a persistence unit and carries the migrations.

# Which of the consuming service's datasources reaches the blob tables. This replaces
# qits.artifacts.blobs-dir: blob content lives in PostgreSQL now, in the three tables of
# db/blobstore-tables.sql, which the service copies into its own Flyway lineage. `<default>` is
# Quarkus' own name for the unnamed datasource, so a service with only one needs no override; a
# service with several names the one that reaches those tables (`artifacts`, `mirror`, `githost`).
qits.artifacts.blobs-datasource=<default>

# How long a blob must sit untouched before a sweep may remove it. The window belongs to the store
# rather than to any collector: it closes the race where a client's blob-exists probe answers "have
# it" for a blob about to go, and the manifest referencing it lands after. The clock is the blob's
# stored_at column, which is what the old on-disk store read off the file's mtime.
qits.artifacts.gc.blob-grace-period=P7D

# How long an unpromoted staging area may sit before the store reclaims it — a stage left by a
# process that died mid-upload, which is the analogue of the temp file the old store leaked. Live
# uploads are never touched: the sweep skips every stage this process holds open.
qits.artifacts.staging-ttl=P1D
