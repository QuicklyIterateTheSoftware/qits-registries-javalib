# TEST-ONLY. The lib ships no datasource, so the suite supplies two.

# The JPA entities: in-memory H2 on the DEFAULT datasource and the default persistence unit, which
# picks up every indexed entity. The schema comes from the mappings, not from Flyway — a lib carries
# no migrations, and generating the DDL from the mappings is what proves they are complete without a
# migration chain to copy. H2 stays for these because the entities are engine-neutral and each
# consumer maps them onto a store of its own.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:blobstore;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# The blob tables: real postgres, because that is the store's only engine — advisory locks, bytea,
# a partial index and an on-conflict promote exist on no other. The url and credentials come from
# EmbeddedPgConfigSource, which starts the server and applies db/blobstore-tables.sql; the name is
# deliberately NOT the default datasource, so the by-name lookup every consumer relies on is
# exercised rather than assumed.
quarkus.datasource.blobs.db-kind=postgresql
qits.artifacts.blobs-datasource=blobs

# Tiny chunks, so a two-kilobyte fixture crosses dozens of chunk boundaries. Every path here is
# arithmetic on the recorded chunk size, so exercising it at 64 bytes exercises it at 1 MiB — and
# doing it this way keeps the suite from having to move megabytes to reach the second chunk.
qits.artifacts.blob-chunk-size=64

# No HTTP extension here, so there is no test port to pin.
quarkus.devservices.enabled=false
