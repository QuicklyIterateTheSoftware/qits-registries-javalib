# THE VERSION TAG IS STILL THE DURABLE STAMP, BUT IT NO LONGER TRIGGERS. Under the release-request
# flow the tag is written by qits-githost's tag primitive, which announces nothing — the trigger is
# qits-projects' `SCMRelease`. A bootstrap replay therefore re-establishes a release by pushing the
# tag quietly and re-presenting the `SCMRelease` through qits-ci's manual trigger door
# (`POST /ci/api/events/trigger`), which runs this same pipeline. qits-ci still announces
# `SoftwareRelease` only where a green run and an `SCMRelease` meet.
event: SCMRelease
when:
  # SCMRelease, not SCMPublishTag: under the release-request flow the version tag is written by
  # qits-githost's tag primitive, which fires no post-receive and so publishes no SCMPublishTag —
  # a recipe listening for the tag event never runs again. qits-projects' Auto Release publishes
  # SCMRelease carrying the repository's public name, and a bootstrap replay arrives as this same
  # event through qits-ci's manual trigger door. A rename updates this line in the same campaign.
  - repository: { exact: qits-registries-javalib }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — what the tag points
# at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all (`branch` is the release request's
# backing branch, which the tagging operation DELETES; `version` names a tag and not a commit), so
# this file could declare no `checkout:`, the run was recorded at `main`, and every release of this
# library displayed as `main@<head>` — a run recorded against a commit it did not build, with the
# released tree named only by the `git fetch refs/tags/…` below.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and `checkout --detach "$QITS_CI_SHA"` lands on the commit. Nothing in qits-ci
# holds a concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so a replay out of the durable log — or a bootstrap replay re-presented through the
# manual trigger door above, which is hand-built and may carry only what this file's `when:` needs —
# resolves nothing here. Without the flag that would cost this pipeline its run: a tag that exists
# and five maven modules silently never published. With it, such a run is recorded at `main`'s head,
# byte-for-byte as before, and the tag fetch in the step below is what supplies the released tree.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  # The store merged in on 2026-08-30 and rides this release. Its coordinate keeps the shape it
  # always had — `qits-blobstore`, not `qits-registries-blobstore` — because consumers pin it and
  # a maven coordinate is a platform-wide contract.
  - { type: maven, name: "eu.wohlben.qits:qits-blobstore" }
  - { type: maven, name: "eu.wohlben.qits:qits-registries-common" }
  - { type: maven, name: "eu.wohlben.qits:qits-registries-npm" }
  - { type: maven, name: "eu.wohlben.qits:qits-registries-maven" }
  - { type: maven, name: "eu.wohlben.qits:qits-registries-oci" }
steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      set -eu
      # THE TAG NAME IS THE VERSION. Nothing upstream vets it now that any tag push reaches here,
      # and it becomes a registry coordinate for five modules, so the shape is checked before
      # anything is fetched or deployed: a CalVer is digits and dots.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      # A NO-OP ON THE ANCHORED PATH AND THE WHOLE MECHANISM ON THE FALLBACK ONE. With the
      # `checkout:` above resolved, the daemon already cloned `--branch <version>` and detached at
      # `commitSha`, so the fetch answers "up to date" and the checkout is where HEAD already is.
      # When the event carried no `commitSha` the run really is at main's head — and main does not
      # hold the released commit at this moment — so these two lines are what makes the released
      # tree appear. Keep them until no untagged release event can arrive any more.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"
      # Skip only when EVERY module of this reactor is published: `deploy` runs at the root and
      # ships them together, so one missing module means the whole run must go again. Named by
      # artifactId, not by directory: the merged store publishes as qits-blobstore.
      published=1
      for artifact in qits-blobstore qits-registries-common qits-registries-npm \
                      qits-registries-maven qits-registries-oci; do
        curl -fsS -o /dev/null \
          "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/$artifact/$version/$artifact-$version.pom" \
          || published=0
      done
      if [ "$published" = 1 ]; then
        echo "every module @$version is already published — skipping"
        exit 0
      fi
      # qits-db-core resolves from the platform registry — the one dependency left outside this
      # reactor since the blobstore merge. The pom's default names localhost:8081 (unreachable
      # inside a step container), and the derived non-localhost address then needs the exact-id
      # mirror in .qits-maven-settings.xml to get past Maven's HTTP blocker — the same pair every
      # service's image build uses.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      # This script is read from main's head, but the checkout above is the release TAG — which may
      # predate a file the script names. Guard on presence: a tree old enough to lack the mirror
      # also predates the platform dependencies that need it.
      settings=""
      if [ -f .qits-maven-settings.xml ]; then
        settings="-s .qits-maven-settings.xml"
      fi
      ./mvnw -B -ntp $settings deploy -DskipTests \
        -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL" \
        -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"
      # THE SBOM IS THE ARTIFACT'S RESOLVED DEPENDENCY TREE, one per declared module, and it goes up
      # in this step — after the deploy and before the run goes green. qits-ci announces
      # `SoftwareRelease` only for a green run, so an SBOM published here can never be missing for a
      # version somebody was told about. A failed PUT fails the release ON PURPOSE.
      #
      # ONE makeBom PER MODULE, because a bill of materials is per artifact and a reactor-wide run
      # would answer for the parent pom instead. THE PAIR IS `directory:artifactId`, and it is a pair
      # rather than one word for exactly the reason the probe above is written by artifactId: the
      # directories are the short names this reactor has always used and the coordinates are not —
      # `blobstore` publishes as `qits-blobstore`. `-pl` wants the left half, the store wants the
      # right half, and neither may be guessed from the other.
      #
      # The plugin resolves from the same repositories mvnw already resolves through, so it needs the
      # same `$settings` mirror and the same repository property the deploy above needed.
      sbom_base="${QITS_MAVEN_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      for pair in blobstore:qits-blobstore common:qits-registries-common \
                  npm:qits-registries-npm maven:qits-registries-maven \
                  oci:qits-registries-oci; do
        module=${pair%%:*}
        artifact=${pair#*:}
        ./mvnw -B -ntp $settings -DskipTests -pl "$module" \
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
          -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6 \
          -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL"
        curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
          --data-binary "@$module/target/sbom.json" \
          "$sbom_base/maven/eu.wohlben.qits:$artifact/-/$version"
      done
