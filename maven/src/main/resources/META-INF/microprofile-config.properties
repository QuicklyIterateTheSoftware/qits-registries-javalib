# Defaults this library jar ships (ordinal 100). The consuming service or its environment overrides
# any of them. Only the maven repository's own knobs are here — no datasource, no persistence unit
# and no Flyway keys: the service that owns the tables carries those.

# The per-file ceiling on a deploy or a cached fetch. 512M because real Central artifacts pass
# 128M: com.microsoft.playwright:driver-bundle is 201M, and on 2026-09-01 the old cap failed every
# userflows build's resolve through the platform mirror — misreported as "upstream unreachable"
# until MavenUpstream learned to name the cap.
qits.artifacts.maven.max-artifact-size=512M

# What MAVEN_PROXY caches, and the TTL on the one maven document that mutates —
# maven-metadata.xml. Everything else under a release path is immutable and cached forever.
qits.artifacts.maven.proxy.upstream=https://repo1.maven.org/maven2
qits.artifacts.maven.proxy.metadata-ttl=PT1H
